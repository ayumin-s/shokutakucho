<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="食卓帖">
<meta name="theme-color" content="#FFFFFF">
<title>食卓帖</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23FFFFFF'/%3E%3Ctext x='90' y='112' font-size='58' font-family='serif' fill='%23A34954' text-anchor='middle'%3E食%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Parisienne&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --tint:#F5E9EA; --line:#E8D9DA; --line2:#EFE4E5;
  --rose:#A34954; --rose-l:#C4A9AC; --ink:#221C1D; --sub:#544749; --mute:#B5A2A4;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:'Zen Kaku Gothic New',sans-serif;
  padding-bottom:calc(env(safe-area-inset-bottom) + 92px);}
button,input,textarea,select{font:inherit; color:inherit;}
.en{font-family:'Jost',sans-serif; font-weight:300; letter-spacing:.18em;}
.hand{font-family:'Parisienne',cursive;}
.hide{display:none !important;}

header{padding:calc(env(safe-area-inset-top) + 22px) 20px 0; text-align:center;}
.brand{font-family:'Jost',sans-serif; font-weight:300; font-size:18px; letter-spacing:.42em; padding-left:.42em;}
.tagline{font-family:'Parisienne',cursive; font-size:14px; color:var(--rose-l); margin-top:4px;}
nav{display:flex; justify-content:center; gap:28px; margin-top:20px; border-bottom:0.5px solid var(--line2);}
nav button{background:none; border:0; padding:0 2px 11px; font-family:'Jost',sans-serif; font-weight:300;
  font-size:11px; letter-spacing:.2em; color:var(--rose-l); border-bottom:1px solid transparent;}
nav button.on{color:var(--ink); border-bottom-color:var(--ink);}
main{padding:22px 20px 0; max-width:640px; margin:0 auto;}

.owner-switch{display:flex; gap:8px; overflow-x:auto; margin-bottom:18px;}
.owner-switch button{background:none; border:0.5px solid var(--line); padding:5px 13px; font-size:11px;
  color:var(--mute); white-space:nowrap;}
.owner-switch button.on{background:var(--ink); color:#fff; border-color:var(--ink);}

.scenes{display:flex; gap:4px; flex-wrap:wrap; justify-content:center; margin-bottom:14px;}
.scene{font-family:'Jost',sans-serif; font-weight:300; font-size:10px; letter-spacing:.12em;
  color:var(--rose-l); background:none; border:0; padding:5px 9px;}
.scene.on{background:var(--rose); color:#fff;}
.subfilter{display:flex; justify-content:center; gap:20px; margin-bottom:16px; flex-wrap:wrap;}
.subfilter button{background:none; border:0; font-family:'Jost',sans-serif; font-weight:300;
  font-size:10px; letter-spacing:.16em; color:var(--rose-l); padding:0 0 3px;}
.subfilter button.on{color:var(--ink); border-bottom:0.5px solid var(--ink);}

.bar{display:flex; align-items:center; gap:10px; background:#FAF6F6; padding:9px 13px; margin-bottom:18px;}
.bar input{flex:1; border:0; background:transparent; font-size:14px; outline:0; min-width:0;}
.bar select{border:0; background:transparent; font-size:11px; color:var(--sub); outline:0;}

.month{font-family:'Jost',sans-serif; font-weight:300; font-size:10px; letter-spacing:.26em;
  color:var(--rose-l); margin:26px 0 13px;}
.meal{margin-bottom:24px; padding-bottom:20px; border-bottom:0.5px solid var(--line2);}
.meal img{width:100%; height:188px; object-fit:cover; display:block; margin-bottom:13px;}
.meal .kind{font-family:'Jost',sans-serif; font-weight:300; font-size:9px; letter-spacing:.24em;
  color:var(--rose); margin-bottom:7px;}
.meal h3{margin:0 0 8px; font-size:17px; font-weight:400; letter-spacing:.04em;}
.meal p{margin:0 0 10px; font-size:12px; color:var(--sub); line-height:1.9;}
.meal .foot{display:flex; align-items:center; gap:9px; font-size:11px; color:var(--mute); flex-wrap:wrap;}
.shoplink{color:#8A7D70; border:0; border-bottom:0.5px solid var(--line); background:none; padding:0 0 1px;}

.shop{padding-bottom:20px; margin-bottom:20px; border-bottom:0.5px solid var(--line2);}
.shop img{width:100%; height:140px; object-fit:cover; display:block; margin-bottom:12px;}
.shop .head{display:flex; align-items:baseline; gap:8px; margin-bottom:7px;}
.shop .name{font-size:15px;}
.shop .badge{font-size:9px; padding:2px 7px; margin-left:auto; white-space:nowrap;}
.shop .badge.wish{color:var(--rose); border:0.5px solid var(--line);}
.shop .badge.visited{color:#8A7D70; background:#F7F2F2;}
.shop .meta{font-size:11px; color:var(--mute); margin-bottom:8px;}
.shop .memo{font-size:12px; color:var(--sub); line-height:1.9; margin-bottom:11px;}
.shop .acts{display:flex; gap:18px; flex-wrap:wrap;}
.shop .acts button, .shop .acts a{font-family:'Jost',sans-serif; font-weight:300; font-size:10px;
  letter-spacing:.14em; color:#8A7D70; background:none; border:0; border-bottom:0.5px solid var(--line);
  padding:0 0 3px; text-decoration:none;}

.field{border-bottom:0.5px solid var(--line2); padding-bottom:9px; margin-bottom:17px;}
.field label{display:block; font-size:10px; color:var(--mute); margin-bottom:5px;}
.field input, .field textarea, .field select{width:100%; border:0; background:transparent; outline:0;
  font-size:16px; resize:none;}
.block{margin-bottom:17px;}
.block label{display:block; font-size:10px; color:var(--mute); margin-bottom:8px;}
.pick{display:flex; gap:5px; flex-wrap:wrap;}
.pick button{font-family:'Jost',sans-serif; font-weight:300; font-size:9px; letter-spacing:.1em;
  color:var(--rose-l); background:none; border:0.5px solid var(--line2); padding:5px 10px;}
.pick button.on{background:var(--rose); color:#fff; border-color:var(--rose);}
.prio{display:flex; gap:16px; align-items:baseline;}
.prio button{font-family:'Parisienne',cursive; font-size:17px; color:var(--rose-l);
  background:none; border:0; border-bottom:1px solid transparent; padding:0 0 2px;}
.prio button.on{color:var(--rose); border-bottom-color:var(--rose);}
.photobox{width:100%; height:100px; border:0.5px dashed var(--line); background:none;
  color:var(--rose-l); font-size:11px; margin-bottom:20px;}
.photowrap{position:relative; margin-bottom:20px;}
.photowrap img{width:100%; height:176px; object-fit:cover; display:block;}
.photowrap button{position:absolute; top:8px; right:8px; width:26px; height:26px; border:0;
  background:rgba(34,28,29,.6); color:#fff; font-size:13px;}
.stars{display:flex; gap:7px; font-size:21px; color:var(--rose);}
.stars button{background:none; border:0; color:inherit; font-size:inherit; padding:0;}
.primary{width:100%; background:var(--ink); color:#FBF7F7; border:0; padding:14px; font-size:13px; margin-top:6px;}
.ghost{width:100%; background:none; color:var(--mute); border:0; padding:12px; font-size:12px;}
.seg{display:flex; border:0.5px solid var(--line); margin-bottom:20px;}
.seg button{flex:1; background:none; border:0; padding:11px; font-family:'Jost',sans-serif;
  font-weight:300; font-size:10px; letter-spacing:.18em; color:var(--rose-l);}
.seg button.on{background:var(--rose); color:#fff;}
.back{background:none; border:0; font-size:19px; color:var(--ink); padding:0 0 14px;}

.fab{position:fixed; right:20px; bottom:calc(env(safe-area-inset-bottom) + 22px);
  width:52px; height:52px; border-radius:50%; background:var(--ink); color:#FBF7F7; border:0; font-size:24px;
  box-shadow:0 4px 16px rgba(34,28,29,.22);}
.fabmenu{position:fixed; right:20px; bottom:calc(env(safe-area-inset-bottom) + 84px);
  display:flex; flex-direction:column; gap:9px; align-items:flex-end;}
.fabmenu button{background:#fff; border:0.5px solid var(--line); padding:9px 16px; font-size:13px;
  box-shadow:0 3px 12px rgba(34,28,29,.12);}

.empty{text-align:center; padding:52px 0; color:var(--mute); font-size:12px; line-height:2;}
.err{color:var(--rose); font-size:11px; text-align:center; margin:14px 0; line-height:1.8;}
.note{font-size:11px; color:var(--mute); line-height:1.9;}
.row{display:flex; align-items:center; gap:11px; padding:13px 0; border-bottom:0.5px solid var(--line2);}
.row .grow{flex:1; min-width:0;}
.row .nm{font-size:14px;}
.row .sm{font-size:11px; color:var(--mute); margin-top:3px;}
.row button{font-size:11px; background:none; border:0.5px solid var(--line); padding:5px 11px; color:var(--sub);}
.check{width:19px; height:19px; border:0.5px solid var(--line); flex:0 0 auto; display:flex;
  align-items:center; justify-content:center; font-size:12px; color:var(--rose); background:none;}
.sheet{position:fixed; inset:0; background:rgba(34,28,29,.35); display:flex; align-items:flex-end; z-index:50;}
.sheet .inner{background:#fff; width:100%; max-height:86vh; overflow:auto;
  padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);}
.auth{max-width:330px; margin:30px auto 0;}
.auth input{width:100%; border:0.5px solid var(--line); background:none; padding:13px 15px;
  font-size:16px; margin-bottom:11px; outline:0;}
h2.sec{font-size:15px; font-weight:400; margin:0 0 5px;}
.secwrap{margin-bottom:30px;}
</style>
</head>
<body>

<header>
  <div class="brand">SHOKUTAKU</div>
  <div class="tagline">everyday, deliciously</div>
  <nav id="nav" class="hide">
    <button data-tab="table" class="on">TABLE</button>
    <button data-tab="shops">SHOPS</button>
    <button data-tab="menu">MENU</button>
  </nav>
</header>

<main>
  <section id="authView" class="hide">
    <div class="auth">
      <p class="note" id="authLead" style="text-align:center;margin-bottom:20px;">
        メールアドレスとパスワードでログインしてください。
      </p>
      <input id="email" type="email" placeholder="メールアドレス" autocomplete="email" inputmode="email">
      <input id="password" type="password" placeholder="パスワード（6文字以上）" autocomplete="current-password">
      <button class="primary" id="authBtn">ログイン</button>
      <p class="err hide" id="authMsg"></p>
      <button class="ghost" id="toggleAuth">はじめての方はこちら（新規登録）</button>
    </div>
  </section>

  <section id="pendingView" class="hide">
    <div class="empty">
      <div class="hand" style="font-size:24px;color:var(--rose);margin-bottom:14px;">thank you</div>
      登録を受け付けました。<br>管理者の承認をお待ちください。<br><br>
      <button class="ghost" id="pendingSignout" style="width:auto;">ログアウト</button>
    </div>
  </section>

  <section id="tableView" class="hide"></section>
  <section id="shopsView" class="hide"></section>
  <section id="menuView" class="hide"></section>
  <section id="formView" class="hide"></section>
  <section id="detailView" class="hide"></section>
</main>

<div class="fabmenu hide" id="fabmenu"></div>
<button class="fab hide" id="fab">＋</button>
<div id="sheetHost"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
