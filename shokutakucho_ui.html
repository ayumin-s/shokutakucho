<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="食卓帖">
  <meta name="theme-color" content="#1F2A24">
  <title>食卓帖</title>
  <link rel="apple-touch-icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%231F2A24'/%3E%3Ccircle cx='90' cy='90' r='52' fill='none' stroke='%23A23B2E' stroke-width='6'/%3E%3Ctext x='90' y='112' font-size='62' font-family='serif' fill='%23A23B2E' text-anchor='middle'%3E食%3C/text%3E%3C/svg%3E">
  <link
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #1F2A24;
      --paper: #F1E9D8;
      --line: #DCCFAE;
      --beni: #A23B2E;
      --ai: #33506B;
      --moss: #6B7A55;
      --text: #2A2521;
      --cream: #F4EFDD;
      --faint: #8A8071;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--ink);
      font-family: 'Zen Kaku Gothic New', sans-serif;
      color: var(--text);
    }

    .mincho {
      font-family: 'Shippori Mincho', serif;
    }

    header {
      padding: calc(env(safe-area-inset-top) + 26px) 20px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      margin: 0;
      color: var(--cream);
      font-size: 26px;
      line-height: 1;
    }

    header p {
      margin: 5px 0 0;
      color: #9DA79A;
      font-size: 11px;
    }

    #status {
      margin-left: auto;
      color: #9DA79A;
      font-size: 10px;
      text-align: right;
      line-height: 1.5;
    }

    .stamp {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-family: 'Shippori Mincho', serif;
      font-weight: 700;
      transform: rotate(-6deg);
      flex: 0 0 auto;
    }

    main {
      background: var(--paper);
      border-radius: 28px 28px 0 0;
      min-height: calc(100vh - 110px);
      padding: 20px 16px calc(env(safe-area-inset-bottom) + 110px);
    }

    .searchbar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 14px;
      margin-bottom: 12px;
    }

    .searchbar input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      font: inherit;
      font-size: 15px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 13px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--faint);
      font-family: inherit;
    }

    .tab.on {
      background: var(--ink);
      color: var(--cream);
      border-color: var(--ink);
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
      position: relative;
      display: flex;
    }

    .card img.thumb {
      width: 96px;
      height: 96px;
      object-fit: cover;
      flex: 0 0 auto;
    }

    .card .body {
      flex: 1;
      padding: 12px 14px;
      min-width: 0;
    }

    .card h3 {
      margin: 0;
      font-size: 15px;
      font-family: 'Shippori Mincho', serif;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta {
      font-size: 11px;
      color: var(--faint);
      margin: 4px 0 6px;
    }

    .memo {
      font-size: 12px;
      color: #584F44;
      margin: 0 0 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .cardlink {
      font-size: 11px;
      color: var(--ai);
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .tagrow {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .tag {
      font-size: 10px;
      background: var(--paper);
      color: var(--moss);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .del {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 0;
      background: rgba(255, 255, 255, .85);
      color: var(--faint);
      font-size: 13px;
    }

    .fab {
      position: fixed;
      right: 20px;
      bottom: calc(env(safe-area-inset-bottom) + 24px);
      width: 56px;
      height: 56px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--cream);
      border: 0;
      font-size: 28px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .3);
    }

    .fabmenu {
      position: fixed;
      right: 20px;
      bottom: calc(env(safe-area-inset-bottom) + 90px);
      display: none;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
    }

    .fabmenu.on {
      display: flex;
    }

    .fabitem {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border-radius: 999px;
      padding: 8px 16px 8px 10px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .2);
      font-family: inherit;
    }

    .field {
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 10px;
      color: #B0A487;
      letter-spacing: .05em;
      margin-bottom: 6px;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font: inherit;
      font-size: 16px;
      resize: none;
    }

    .submit {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--cream);
      border: 0;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      margin-top: 8px;
    }

    .photobox {
      width: 100%;
      height: 112px;
      border: 1.5px dashed var(--line);
      border-radius: 16px;
      color: var(--faint);
      background: transparent;
      font: inherit;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      padding: 64px 0;
    }

    .empty h2 {
      font-family: 'Shippori Mincho', serif;
      font-size: 18px;
      margin: 0 0 8px;
      font-weight: 500;
    }

    .empty p {
      font-size: 12px;
      color: var(--faint);
      margin: 0;
    }

    .footer {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .linkbtn {
      background: none;
      border: 0;
      font: inherit;
      font-size: 11px;
      color: var(--moss);
    }

    .err {
      color: var(--beni);
      font-size: 11px;
      text-align: center;
      margin-top: 16px;
      padding: 0 20px;
      line-height: 1.6;
    }

    .hide {
      display: none !important;
    }

    /* ログイン画面 */
    .auth {
      max-width: 340px;
      margin: 40px auto;
      text-align: center;
    }

    .auth h2 {
      font-family: 'Shippori Mincho', serif;
      font-size: 20px;
      font-weight: 500;
      margin: 0 0 8px;
    }

    .auth p.lead {
      font-size: 12px;
      color: var(--faint);
      margin: 0 0 28px;
      line-height: 1.7;
    }

    .auth input {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      font: inherit;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .auth .submit {
      margin-top: 4px;
    }

    .authmsg {
      font-size: 12px;
      margin-top: 16px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <header>
    <div class="stamp" style="width:34px;height:34px;border:2px solid var(--beni);color:var(--beni);font-size:17px;">作
    </div>
    <div>
      <h1 class="mincho">食卓帖</h1>
      <p>作った記録・食べた記録をひとつに</p>
    </div>
    <div id="status"></div>
  </header>

  <main>
    <!-- ログイン -->
    <section id="authView" class="hide">
      <div class="auth">
        <h2 id="authHeading">おかえりなさい</h2>
        <p class="lead" id="authLead">メールアドレスとパスワードでログインすると、<br>どの端末からでも同じ記録が開けます。</p>
        <input id="email" type="email" placeholder="メールアドレス" autocomplete="email" inputmode="email">
        <input id="password" type="password" placeholder="パスワード（6文字以上）" autocomplete="current-password">
        <button class="submit" id="authBtn">ログイン</button>
        <p class="authmsg" id="authMsg"></p>
        <button class="linkbtn" id="toggleAuth" style="margin-top:20px;">はじめての方はこちら（新規登録）</button>
      </div>
    </section>

    <!-- 一覧 -->
    <section id="listView" class="hide">
      <div class="searchbar">
        <span style="color:var(--faint);font-size:14px;">⌕</span>
        <input id="q" placeholder="料理名・お店・タグで探す">
      </div>
      <div class="tabs">
        <button class="tab on" data-f="all">すべて</button>
        <button class="tab" data-f="cooked">作った</button>
        <button class="tab" data-f="eaten">食べた</button>
      </div>
      <div id="list"></div>
      <p id="err" class="err hide"></p>
      <div class="footer">
        <div style="display:flex;gap:20px;">
          <button class="linkbtn" id="exportBtn">↓ バックアップを書き出す</button>
          <button class="linkbtn" id="importBtn">↑ 読み込む</button>
          <input type="file" id="importFile" accept="application/json,.json" class="hide">
        </div>
        <button class="linkbtn" id="signoutBtn" style="color:var(--faint);">ログアウト</button>
      </div>
    </section>

    <!-- 入力フォーム -->
    <section id="formView" class="hide">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        <button id="backBtn" style="background:none;border:0;font-size:20px;color:var(--text);">‹</button>
        <h2 id="formTitle" class="mincho" style="margin:0;font-size:18px;font-weight:500;">記録</h2>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:20px;">
        <button class="typebtn" id="typeCooked"><span class="stamp"
            style="width:18px;height:18px;border:1.5px solid currentColor;font-size:9px;">作</span>作った</button>
        <button class="typebtn" id="typeEaten"><span class="stamp"
            style="width:18px;height:18px;border:1.5px solid currentColor;font-size:9px;">食</span>食べた</button>
      </div>
      <div style="margin-bottom:20px;">
        <input type="file" id="photoInput" accept="image/*" class="hide">
        <div id="photoWrap"></div>
      </div>
      <div class="field"><label id="titleLabel">料理名</label><input id="fTitle" placeholder="例：鶏の照り焼き"></div>
      <div class="field"><label>日付</label><input type="date" id="fDate"></div>
      <div class="field" id="placeField"><label>お店</label><input id="fPlace" placeholder="例：〇〇食堂"></div>
      <div class="field"><label id="memoLabel">メモ</label><textarea id="fMemo" rows="3"></textarea></div>
      <div class="field"><label>URL（レシピ・お店のページなど）</label><input id="fUrl" type="url" placeholder="https://..."
          inputmode="url"></div>
      <div class="field"><label>タグ（カンマ区切り）</label><input id="fTags" placeholder="例：和食, 週末, 作り置き"></div>
      <div class="field"><label>満足度</label>
        <div id="stars" style="display:flex;gap:6px;font-size:24px;color:var(--beni);"></div>
      </div>
      <button class="submit" id="saveBtn">記録する</button>
    </section>
  </main>

  <div class="fabmenu hide" id="fabmenu">
    <button class="fabitem" data-t="eaten" style="color:var(--ai);border:1px solid var(--ai);">
      <span class="stamp" style="width:22px;height:22px;border:1.5px solid currentColor;font-size:11px;">食</span>食べた記録
    </button>
    <button class="fabitem" data-t="cooked" style="color:var(--beni);border:1px solid var(--beni);">
      <span class="stamp" style="width:22px;height:22px;border:1.5px solid currentColor;font-size:11px;">作</span>作った記録
    </button>
  </div>
  <button class="fab hide" id="fab">＋</button>

  <script type="module">
    // ============================================================
    // ▼▼▼ ここだけ書き換えてください ▼▼▼
    const SUPABASE_URL = 'https://uxtahnqledjyrbttpckp.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'sb_publishable_9uBKiV3A21y3_3E03m87EQ_BWRQimxe';
    // ▲▲▲ ここだけ書き換えてください ▲▲▲
    // ============================================================

    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const CACHE = 'shokutakucho-cache-v1';
    let entries = [], filter = 'all', query = '', form = null, mode = 'signin';

    const $ = id => document.getElementById(id);
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const pad = n => String(n).padStart(2, '0');
    const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
    const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function fmtDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      return (d.getMonth() + 1) + '月' + d.getDate() + '日(' + ['日', '月', '火', '水', '木', '金', '土'][d.getDay()] + ')';
    }
    function showErr(m) { const e = $('err'); e.textContent = m; e.classList.toggle('hide', !m); }
    function setStatus(m) { $('status').textContent = m; }

    function compress(file, max = 720, q = 0.6) {
      return new Promise((res, rej) => {
        const r = new FileReader();
        r.onerror = () => rej(new Error('読み込み失敗'));
        r.onload = () => {
          const img = new Image();
          img.onerror = () => rej(new Error('画像失敗'));
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
            else if (h > max) { w = Math.round(w * max / h); h = max; }
            const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
            cv.getContext('2d').drawImage(img, 0, 0, w, h);
            res(cv.toDataURL('image/jpeg', q));
          };
          img.src = r.result;
        };
        r.readAsDataURL(file);
      });
    }

    // ---- 認証 ----------------------------------------------------
    function showAuth() {
      $('authView').classList.remove('hide');
      $('listView').classList.add('hide');
      $('formView').classList.add('hide');
      $('fab').classList.add('hide');
      $('fabmenu').classList.remove('on');
      setStatus('');
    }
    function showList() {
      $('authView').classList.add('hide');
      $('listView').classList.remove('hide');
      $('formView').classList.add('hide');
      $('fab').classList.remove('hide');
    }
    $('toggleAuth').onclick = () => {
      mode = mode === 'signin' ? 'signup' : 'signin';
      const up = mode === 'signup';
      $('authHeading').textContent = up ? 'はじめまして' : 'おかえりなさい';
      $('authLead').innerHTML = up
        ? 'メールアドレスとパスワードを決めてください。<br>この2つで、どの端末からでも記録を開けます。'
        : 'メールアドレスとパスワードでログインすると、<br>どの端末からでも同じ記録が開けます。';
      $('authBtn').textContent = up ? '登録する' : 'ログイン';
      $('toggleAuth').textContent = up ? 'すでに登録済みの方はこちら（ログイン）' : 'はじめての方はこちら（新規登録）';
      $('password').autocomplete = up ? 'new-password' : 'current-password';
      $('authMsg').textContent = '';
    };
    $('authBtn').onclick = async () => {
      const email = $('email').value.trim();
      const password = $('password').value;
      const msg = $('authMsg');
      if (!email || !password) { msg.style.color = 'var(--beni)'; msg.textContent = 'メールアドレスとパスワードを入力してください。'; return; }
      $('authBtn').disabled = true;
      $('authBtn').textContent = '通信中…';
      const fn = mode === 'signup' ? sb.auth.signUp({ email, password }) : sb.auth.signInWithPassword({ email, password });
      const { data, error } = await fn;
      $('authBtn').disabled = false;
      $('authBtn').textContent = mode === 'signup' ? '登録する' : 'ログイン';
      if (error) {
        msg.style.color = 'var(--beni)';
        msg.textContent = error.message.includes('Invalid login')
          ? 'メールアドレスかパスワードが違います。'
          : error.message.includes('already registered')
            ? 'このメールアドレスは登録済みです。ログインに切り替えてください。'
            : error.message;
        return;
      }
      if (mode === 'signup' && !data.session) {
        msg.style.color = 'var(--moss)';
        msg.textContent = '確認メールを送りました。メール内のリンクを開いてから、ログインしてください。';
        return;
      }
      msg.textContent = '';
      $('password').value = '';
      await start();
    };
    $('signoutBtn').onclick = async () => {
      if (!confirm('ログアウトしますか？')) return;
      await sb.auth.signOut();
      entries = [];
      localStorage.removeItem(CACHE);
      showAuth();
    };

    // ---- データ --------------------------------------------------
    function cacheSave() {
      try { localStorage.setItem(CACHE, JSON.stringify(entries)); } catch (e) { }
    }
    function cacheLoad() {
      try { const r = localStorage.getItem(CACHE); if (r) entries = JSON.parse(r); } catch (e) { }
    }
    function sortEntries() {
      entries.sort((a, b) => new Date(b.date) - new Date(a.date) || String(b.created_at || '').localeCompare(String(a.created_at || '')));
    }
    async function pull() {
      setStatus('同期中…');
      const { data, error } = await sb.from('entries').select('*').order('date', { ascending: false });
      if (error) { setStatus('オフライン'); showErr('サーバーから読み込めませんでした（' + error.message + '）。表示は端末に残っている内容です。'); return; }
      entries = data || [];
      sortEntries(); cacheSave(); render(); showErr('');
      setStatus('同期済み');
    }
    async function upsert(row) {
      setStatus('保存中…');
      const { data, error } = await sb.from('entries').upsert(row).select().single();
      if (error) { setStatus('未保存'); showErr('保存できませんでした（' + error.message + '）。通信状況を確認してください。'); return null; }
      setStatus('同期済み'); showErr('');
      return data;
    }
    async function removeRow(id) {
      setStatus('削除中…');
      const { error } = await sb.from('entries').delete().eq('id', id);
      if (error) { setStatus('未保存'); showErr('削除できませんでした（' + error.message + '）。'); return false; }
      setStatus('同期済み');
      return true;
    }

    // ---- 描画 ----------------------------------------------------
    function stampHtml(type, size) {
      const cooked = type === 'cooked';
      const col = cooked ? 'var(--beni)' : 'var(--ai)';
      return `<span class="stamp" style="width:${size}px;height:${size}px;border:1.5px solid ${col};color:${col};font-size:${Math.round(size * 0.5)}px;">${cooked ? '作' : '食'}</span>`;
    }
    function render() {
      const q = query.trim().toLowerCase();
      const rows = entries.filter(en => {
        if (filter !== 'all' && en.type !== filter) return false;
        if (!q) return true;
        return [en.title, en.place, en.memo, en.tags].some(v => (v || '').toLowerCase().includes(q));
      });
      if (rows.length === 0) {
        $('list').innerHTML = `<div class="empty">
      <h2>${entries.length === 0 ? 'まだ何も記されていません' : '見つかりませんでした'}</h2>
      <p>${entries.length === 0 ? '右下の＋から、最初の一皿を記録しましょう' : '検索条件を変えてみてください'}</p></div>`;
        return;
      }
      $('list').innerHTML = rows.map(en => {
        const tags = (en.tags || '').split(',').map(t => t.trim()).filter(Boolean).slice(0, 3);
        return `<div class="card" data-id="${en.id}">
      ${en.photo ? `<img class="thumb" src="${en.photo}" alt="">` : ''}
      <div class="body">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;">${stampHtml(en.type, 22)}<h3>${esc(en.title)}</h3></div>
        <div class="meta">${fmtDate(en.date)}${en.place ? ' ・ ' + esc(en.place) : ''}</div>
        ${en.memo ? `<p class="memo">${esc(en.memo)}</p>` : ''}
        ${en.url ? `<a class="cardlink" href="${esc(en.url)}" target="_blank" rel="noopener">🔗 ${esc(en.url)}</a>` : ''}
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <span style="color:var(--beni);font-size:12px;">${en.rating ? '★'.repeat(en.rating) : ''}</span>
          <div class="tagrow">${tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>
        </div>
      </div>
      <button class="del" data-del="${en.id}">🗑</button>
    </div>`;
      }).join('');
    }

    // ---- フォーム ------------------------------------------------
    const blank = type => ({ id: null, type, title: '', date: today(), place: '', memo: '', url: '', tags: '', rating: 0, photo: null });
    function openForm(f) {
      form = f;
      $('listView').classList.add('hide');
      $('formView').classList.remove('hide');
      $('fab').classList.add('hide');
      $('formTitle').textContent = f.id ? '記録を編集' : (f.type === 'cooked' ? '作った記録' : '食べた記録');
      $('fTitle').value = f.title; $('fDate').value = f.date; $('fPlace').value = f.place || '';
      $('fMemo').value = f.memo || ''; $('fUrl').value = f.url || ''; $('fTags').value = f.tags || '';
      $('saveBtn').textContent = f.id ? '更新する' : '記録する';
      syncType(); renderStars(); renderPhoto();
      window.scrollTo(0, 0);
    }
    function closeForm() {
      form = null;
      $('formView').classList.add('hide');
      $('listView').classList.remove('hide');
      $('fab').classList.remove('hide');
    }
    function syncType() {
      const cooked = form.type === 'cooked';
      const base = 'flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:12px;font:inherit;font-size:14px;font-weight:500;';
      $('typeCooked').style.cssText = base + (cooked ? 'background:var(--beni);color:#fff;border:1px solid var(--beni);' : 'background:#fff;color:var(--beni);border:1px solid var(--beni);');
      $('typeEaten').style.cssText = base + (!cooked ? 'background:var(--ai);color:#fff;border:1px solid var(--ai);' : 'background:#fff;color:var(--ai);border:1px solid var(--ai);');
      $('placeField').classList.toggle('hide', cooked);
      $('titleLabel').textContent = cooked ? '料理名' : '料理名・お店の一皿';
      $('memoLabel').textContent = cooked ? '工夫・レシピメモ' : '感想';
      $('fTitle').placeholder = cooked ? '例：鶏の照り焼き' : '例：担々麺';
      $('fMemo').placeholder = cooked ? '味付け、参考にしたレシピ、次回への改善点など' : '味、雰囲気、また行きたいかなど';
    }
    function renderStars() {
      $('stars').innerHTML = [1, 2, 3, 4, 5].map(n => `<span data-star="${n}" style="cursor:pointer;">${n <= form.rating ? '★' : '☆'}</span>`).join('');
    }
    function renderPhoto() {
      const w = $('photoWrap');
      if (form.photo) {
        w.innerHTML = `<div style="position:relative;">
      <img src="${form.photo}" style="width:100%;height:176px;object-fit:cover;border-radius:16px;">
      <button id="rmPhoto" style="position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:999px;border:0;background:rgba(0,0,0,.55);color:#fff;">✕</button></div>`;
        $('rmPhoto').onclick = () => { form.photo = null; renderPhoto(); };
      } else {
        w.innerHTML = `<button class="photobox" id="addPhoto">📷<br>写真を追加</button>`;
        $('addPhoto').onclick = () => $('photoInput').click();
      }
    }

    // ---- イベント ------------------------------------------------
    $('q').oninput = e => { query = e.target.value; render(); };
    document.querySelectorAll('.tab').forEach(t => {
      t.onclick = () => { document.querySelectorAll('.tab').forEach(x => x.classList.remove('on')); t.classList.add('on'); filter = t.dataset.f; render(); };
    });
    $('fab').onclick = () => $('fabmenu').classList.toggle('on');
    document.querySelectorAll('.fabitem').forEach(b => {
      b.onclick = () => { $('fabmenu').classList.remove('on'); openForm(blank(b.dataset.t)); };
    });
    $('backBtn').onclick = closeForm;
    $('typeCooked').onclick = () => { form.type = 'cooked'; syncType(); };
    $('typeEaten').onclick = () => { form.type = 'eaten'; syncType(); };
    $('stars').onclick = e => {
      const n = e.target.dataset.star; if (!n) return;
      form.rating = (+n === form.rating) ? 0 : +n; renderStars();
    };
    $('photoInput').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try { form.photo = await compress(f); renderPhoto(); } catch (err) { }
      e.target.value = '';
    };
    $('saveBtn').onclick = async () => {
      const t = $('fTitle').value.trim();
      if (!t) { $('fTitle').focus(); return; }
      const { data: { user } } = await sb.auth.getUser();
      if (!user) { showAuth(); return; }
      const row = {
        type: form.type,
        title: t,
        date: $('fDate').value || today(),
        place: $('fPlace').value.trim(),
        memo: $('fMemo').value.trim(),
        url: $('fUrl').value.trim(),
        tags: $('fTags').value,
        rating: form.rating || 0,
        photo: form.photo,
        user_id: user.id
      };
      if (form.id) row.id = form.id;
      $('saveBtn').disabled = true;
      const saved = await upsert(row);
      $('saveBtn').disabled = false;
      if (!saved) { closeForm(); return; }
      const i = entries.findIndex(en => en.id === saved.id);
      if (i >= 0) entries[i] = saved; else entries.unshift(saved);
      sortEntries(); cacheSave(); render(); closeForm();
    };
    $('list').onclick = async e => {
      const del = e.target.closest('[data-del]');
      if (del) {
        if (!confirm('この記録を削除しますか？')) return;
        if (await removeRow(del.dataset.del)) {
          entries = entries.filter(en => en.id !== del.dataset.del);
          cacheSave(); render();
        }
        return;
      }
      if (e.target.closest('.cardlink')) return;
      const card = e.target.closest('.card');
      if (card) {
        const en = entries.find(x => x.id === card.dataset.id);
        if (en) openForm({ ...en });
      }
    };
    $('exportBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = '食卓帖-backup-' + today() + '.json';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    };
    $('importBtn').onclick = () => $('importFile').click();
    $('importFile').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = async () => {
        try {
          const data = JSON.parse(r.result);
          if (!Array.isArray(data)) throw new Error();
          const { data: { user } } = await sb.auth.getUser();
          const rows = data.map(en => ({
            type: en.type || 'eaten', title: en.title || '(無題)', date: en.date || today(),
            place: en.place || '', memo: en.memo || '', url: en.url || '', tags: en.tags || '',
            rating: en.rating || 0, photo: en.photo || null, user_id: user.id
          }));
          setStatus('取り込み中…');
          const { error } = await sb.from('entries').insert(rows);
          if (error) { alert('取り込みに失敗しました：' + error.message); setStatus('未保存'); return; }
          await pull();
          alert('読み込みました（' + rows.length + '件）');
        } catch (err) { alert('バックアップファイルを読み込めませんでした。'); }
      };
      r.readAsText(f);
      e.target.value = '';
    };

    // ---- 起動 ----------------------------------------------------
    async function start() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { showAuth(); return; }
      showList();
      cacheLoad(); render();
      await pull();
    }
    start();
  </script>
</body>

</html>
