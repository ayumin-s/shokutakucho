<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="食卓帖">
<meta name="theme-color" content="#1F2A24">
<title>食卓帖</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%231F2A24'/%3E%3Ccircle cx='90' cy='90' r='52' fill='none' stroke='%23A23B2E' stroke-width='6'/%3E%3Ctext x='90' y='112' font-size='62' font-family='serif' fill='%23A23B2E' text-anchor='middle'%3E食%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2A24; --paper:#F1E9D8; --line:#DCCFAE; --shadow:#C9BB98;
    --beni:#A23B2E; --ai:#33506B; --moss:#6B7A55;
    --text:#2A2521; --cream:#F4EFDD; --faint:#8A8071;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--ink); font-family:'Zen Kaku Gothic New',sans-serif; color:var(--text);}
  .mincho{font-family:'Shippori Mincho',serif;}
  header{padding:calc(env(safe-area-inset-top) + 26px) 20px 20px; display:flex; align-items:center; gap:12px;}
  header h1{margin:0; color:var(--cream); font-size:26px; line-height:1;}
  header p{margin:5px 0 0; color:#9DA79A; font-size:11px;}
  .stamp{display:flex; align-items:center; justify-content:center; border-radius:999px; font-family:'Shippori Mincho',serif; font-weight:700; transform:rotate(-6deg); flex:0 0 auto;}
  main{background:var(--paper); border-radius:28px 28px 0 0; min-height:calc(100vh - 110px); padding:20px 16px calc(env(safe-area-inset-bottom) + 110px);}
  .searchbar{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:9px 14px; margin-bottom:12px;}
  .searchbar input{flex:1; border:0; outline:0; background:transparent; font:inherit; font-size:15px;}
  .tabs{display:flex; gap:8px; margin-bottom:20px;}
  .tab{padding:7px 15px; border-radius:999px; font-size:13px; border:1px solid var(--line); background:transparent; color:var(--faint); font-family:inherit;}
  .tab.on{background:var(--ink); color:var(--cream); border-color:var(--ink);}
  .card{background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; margin-bottom:12px; position:relative; display:flex;}
  .card img.thumb{width:96px; height:96px; object-fit:cover; flex:0 0 auto;}
  .card .body{flex:1; padding:12px 14px; min-width:0;}
  .card h3{margin:0; font-size:15px; font-family:'Shippori Mincho',serif; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .meta{font-size:11px; color:var(--faint); margin:4px 0 6px;}
  .memo{font-size:12px; color:#584F44; margin:0 0 6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .cardlink{font-size:11px; color:var(--ai); text-decoration:none; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px;}
  .tagrow{display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end;}
  .tag{font-size:10px; background:var(--paper); color:var(--moss); padding:2px 7px; border-radius:999px;}
  .del{position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:999px; border:0; background:rgba(255,255,255,.85); color:var(--faint); font-size:13px;}
  .fab{position:fixed; right:20px; bottom:calc(env(safe-area-inset-bottom) + 24px); width:56px; height:56px; border-radius:999px; background:var(--ink); color:var(--cream); border:0; font-size:28px; box-shadow:0 6px 18px rgba(0,0,0,.3);}
  .fabmenu{position:fixed; right:20px; bottom:calc(env(safe-area-inset-bottom) + 90px); display:none; flex-direction:column; gap:10px; align-items:flex-end;}
  .fabmenu.on{display:flex;}
  .fabitem{display:flex; align-items:center; gap:8px; background:#fff; border-radius:999px; padding:8px 16px 8px 10px; font-size:14px; font-weight:500; box-shadow:0 4px 12px rgba(0,0,0,.2); font-family:inherit;}
  .field{border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:16px;}
  .field label{display:block; font-size:10px; color:#B0A487; letter-spacing:.05em; margin-bottom:6px;}
  .field input, .field textarea{width:100%; border:0; outline:0; background:transparent; font:inherit; font-size:16px; resize:none;}
  .submit{width:100%; padding:14px; border-radius:999px; background:var(--ink); color:var(--cream); border:0; font:inherit; font-size:15px; font-weight:500; margin-top:8px;}
  .typebtn{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; padding:11px; border-radius:12px; font:inherit; font-size:14px; font-weight:500; background:#fff;}
  .photobox{width:100%; height:112px; border:1.5px dashed var(--line); border-radius:16px; color:var(--faint); background:transparent; font:inherit; font-size:12px;}
  .empty{text-align:center; padding:64px 0;}
  .empty h2{font-family:'Shippori Mincho',serif; font-size:18px; margin:0 0 8px; font-weight:500;}
  .empty p{font-size:12px; color:var(--faint); margin:0;}
  .footer{margin-top:40px; display:flex; flex-direction:column; align-items:center; gap:16px;}
  .linkbtn{background:none; border:0; font:inherit; font-size:11px; color:var(--moss);}
  .err{color:var(--beni); font-size:11px; text-align:center; margin-top:16px; padding:0 20px; line-height:1.6;}
  .hide{display:none;}
</style>
</head>
<body>

<header>
  <div class="stamp" style="width:34px;height:34px;border:2px solid var(--beni);color:var(--beni);font-size:17px;">作</div>
  <div>
    <h1 class="mincho">食卓帖</h1>
    <p>作った記録・食べた記録をひとつに</p>
  </div>
</header>

<main>
  <!-- 一覧 -->
  <section id="listView">
    <div class="searchbar">
      <span style="color:var(--faint);font-size:14px;">⌕</span>
      <input id="q" placeholder="料理名・お店・タグで探す">
    </div>
    <div class="tabs">
      <button class="tab on" data-f="all">すべて</button>
      <button class="tab" data-f="cooked">作った</button>
      <button class="tab" data-f="eaten">食べた</button>
    </div>
    <div id="list"></div>
    <p id="err" class="err hide"></p>
    <div class="footer">
      <div style="display:flex;gap:20px;">
        <button class="linkbtn" id="exportBtn">↓ バックアップを書き出す</button>
        <button class="linkbtn" id="importBtn">↑ 読み込む</button>
        <input type="file" id="importFile" accept="application/json,.json" class="hide">
      </div>
      <button class="linkbtn" id="resetBtn" style="color:var(--faint);">↺ すべての記録を消去</button>
    </div>
  </section>

  <!-- 入力フォーム -->
  <section id="formView" class="hide">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
      <button id="backBtn" style="background:none;border:0;font-size:20px;color:var(--text);">‹</button>
      <h2 id="formTitle" class="mincho" style="margin:0;font-size:18px;font-weight:500;">記録</h2>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <button class="typebtn" id="typeCooked" data-t="cooked"><span class="stamp" style="width:18px;height:18px;border:1.5px solid currentColor;font-size:9px;">作</span>作った</button>
      <button class="typebtn" id="typeEaten" data-t="eaten"><span class="stamp" style="width:18px;height:18px;border:1.5px solid currentColor;font-size:9px;">食</span>食べた</button>
    </div>

    <div style="margin-bottom:20px;">
      <input type="file" id="photoInput" accept="image/*" class="hide">
      <div id="photoWrap"></div>
    </div>

    <div class="field"><label id="titleLabel">料理名</label><input id="fTitle" placeholder="例：鶏の照り焼き"></div>
    <div class="field"><label>日付</label><input type="date" id="fDate"></div>
    <div class="field" id="placeField"><label>お店</label><input id="fPlace" placeholder="例：〇〇食堂"></div>
    <div class="field"><label id="memoLabel">メモ</label><textarea id="fMemo" rows="3" placeholder="味付け、次回への改善点など"></textarea></div>
    <div class="field"><label>URL（レシピ・お店のページなど）</label><input id="fUrl" type="url" placeholder="https://..." inputmode="url"></div>
    <div class="field"><label>タグ（カンマ区切り）</label><input id="fTags" placeholder="例：和食, 週末, 作り置き"></div>
    <div class="field"><label>満足度</label><div id="stars" style="display:flex;gap:6px;font-size:24px;color:var(--beni);"></div></div>

    <button class="submit" id="saveBtn">記録する</button>
  </section>
</main>

<div class="fabmenu" id="fabmenu">
  <button class="fabitem" data-t="eaten" style="color:var(--ai);border:1px solid var(--ai);">
    <span class="stamp" style="width:22px;height:22px;border:1.5px solid currentColor;font-size:11px;">食</span>食べた記録
  </button>
  <button class="fabitem" data-t="cooked" style="color:var(--beni);border:1px solid var(--beni);">
    <span class="stamp" style="width:22px;height:22px;border:1.5px solid currentColor;font-size:11px;">作</span>作った記録
  </button>
</div>
<button class="fab" id="fab">＋</button>

<script>
const KEY = 'shokutakucho-entries-v1';
let entries = [];
let filter = 'all';
let query = '';
let form = null;

// ---- 保存 ----------------------------------------------------
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){ entries = []; }
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(entries));
    showErr('');
  }catch(e){
    showErr('保存容量がいっぱいです。「バックアップを書き出す」で保存したうえで、写真つきの古い記録を減らしてください。');
  }
}
function showErr(msg){
  const el = document.getElementById('err');
  el.textContent = msg;
  el.classList.toggle('hide', !msg);
}

// ---- ユーティリティ -------------------------------------------
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const pad = n => String(n).padStart(2,'0');
function today(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDate(iso){
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return (d.getMonth()+1)+'月'+d.getDate()+'日('+['日','月','火','水','木','金','土'][d.getDay()]+')';
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function compress(file, max=720, q=0.6){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onerror = () => rej(new Error('読み込み失敗'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('画像失敗'));
      img.onload = () => {
        let {width:w, height:h} = img;
        if(w>h && w>max){ h = Math.round(h*max/w); w = max; }
        else if(h>max){ w = Math.round(w*max/h); h = max; }
        const cv = document.createElement('canvas');
        cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/jpeg', q));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

// ---- 一覧描画 -------------------------------------------------
function stampHtml(type, size){
  const cooked = type === 'cooked';
  const col = cooked ? 'var(--beni)' : 'var(--ai)';
  return `<span class="stamp" style="width:${size}px;height:${size}px;border:1.5px solid ${col};color:${col};font-size:${Math.round(size*0.5)}px;">${cooked?'作':'食'}</span>`;
}

function render(){
  const list = document.getElementById('list');
  const q = query.trim().toLowerCase();
  const rows = entries.filter(en=>{
    if(filter!=='all' && en.type!==filter) return false;
    if(!q) return true;
    return [en.title,en.place,en.memo,en.tags].some(v => (v||'').toLowerCase().includes(q));
  });

  if(rows.length===0){
    list.innerHTML = `<div class="empty">
      <h2>${entries.length===0 ? 'まだ何も記されていません' : '見つかりませんでした'}</h2>
      <p>${entries.length===0 ? '右下の＋から、最初の一皿を記録しましょう' : '検索条件を変えてみてください'}</p></div>`;
    return;
  }

  list.innerHTML = rows.map(en=>{
    const tags = (en.tags||'').split(',').map(t=>t.trim()).filter(Boolean).slice(0,3);
    return `<div class="card" data-id="${en.id}">
      ${en.photo ? `<img class="thumb" src="${en.photo}" alt="">` : ''}
      <div class="body">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;">
          ${stampHtml(en.type,22)}<h3>${esc(en.title)}</h3>
        </div>
        <div class="meta">${fmtDate(en.date)}${en.place ? ' ・ '+esc(en.place) : ''}</div>
        ${en.memo ? `<p class="memo">${esc(en.memo)}</p>` : ''}
        ${en.url ? `<a class="cardlink" href="${esc(en.url)}" target="_blank" rel="noopener">🔗 ${esc(en.url)}</a>` : ''}
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <span style="color:var(--beni);font-size:12px;">${en.rating ? '★'.repeat(en.rating) : ''}</span>
          <div class="tagrow">${tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>
        </div>
      </div>
      <button class="del" data-del="${en.id}">🗑</button>
    </div>`;
  }).join('');
}

// ---- フォーム -------------------------------------------------
function blank(type){
  return {id:null, type, title:'', date:today(), place:'', memo:'', url:'', tags:'', rating:0, photo:null};
}
function openForm(f){
  form = f;
  document.getElementById('listView').classList.add('hide');
  document.getElementById('formView').classList.remove('hide');
  document.getElementById('formTitle').textContent = f.id ? '記録を編集' : (f.type==='cooked'?'作った記録':'食べた記録');
  document.getElementById('fTitle').value = f.title;
  document.getElementById('fDate').value = f.date;
  document.getElementById('fPlace').value = f.place;
  document.getElementById('fMemo').value = f.memo;
  document.getElementById('fUrl').value = f.url || '';
  document.getElementById('fTags').value = f.tags;
  document.getElementById('saveBtn').textContent = f.id ? '更新する' : '記録する';
  syncType(); renderStars(); renderPhoto();
  window.scrollTo(0,0);
}
function closeForm(){
  form = null;
  document.getElementById('formView').classList.add('hide');
  document.getElementById('listView').classList.remove('hide');
}
function syncType(){
  const cooked = form.type==='cooked';
  const a = document.getElementById('typeCooked'), b = document.getElementById('typeEaten');
  a.style.cssText = `flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:12px;font:inherit;font-size:14px;font-weight:500;${cooked?'background:var(--beni);color:#fff;border:1px solid var(--beni);':'background:#fff;color:var(--beni);border:1px solid var(--beni);'}`;
  b.style.cssText = `flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:12px;font:inherit;font-size:14px;font-weight:500;${!cooked?'background:var(--ai);color:#fff;border:1px solid var(--ai);':'background:#fff;color:var(--ai);border:1px solid var(--ai);'}`;
  document.getElementById('placeField').classList.toggle('hide', cooked);
  document.getElementById('titleLabel').textContent = cooked ? '料理名' : '料理名・お店の一皿';
  document.getElementById('memoLabel').textContent = cooked ? '工夫・レシピメモ' : '感想';
  document.getElementById('fTitle').placeholder = cooked ? '例：鶏の照り焼き' : '例：担々麺';
  document.getElementById('fMemo').placeholder = cooked ? '味付け、参考にしたレシピ、次回への改善点など' : '味、雰囲気、また行きたいかなど';
}
function renderStars(){
  const box = document.getElementById('stars');
  box.innerHTML = [1,2,3,4,5].map(n=>`<span data-star="${n}" style="cursor:pointer;">${n<=form.rating?'★':'☆'}</span>`).join('');
}
function renderPhoto(){
  const w = document.getElementById('photoWrap');
  if(form.photo){
    w.innerHTML = `<div style="position:relative;">
      <img src="${form.photo}" style="width:100%;height:176px;object-fit:cover;border-radius:16px;">
      <button id="rmPhoto" style="position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:999px;border:0;background:rgba(0,0,0,.55);color:#fff;">✕</button></div>`;
    document.getElementById('rmPhoto').onclick = ()=>{ form.photo=null; renderPhoto(); };
  }else{
    w.innerHTML = `<button class="photobox" id="addPhoto">📷<br>写真を追加</button>`;
    document.getElementById('addPhoto').onclick = ()=> document.getElementById('photoInput').click();
  }
}

// ---- イベント -------------------------------------------------
document.getElementById('q').oninput = e => { query = e.target.value; render(); };
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); filter = t.dataset.f; render();
  };
});
document.getElementById('fab').onclick = ()=> document.getElementById('fabmenu').classList.toggle('on');
document.querySelectorAll('.fabitem').forEach(b=>{
  b.onclick = ()=>{
    document.getElementById('fabmenu').classList.remove('on');
    openForm(blank(b.dataset.t));
  };
});
document.getElementById('backBtn').onclick = closeForm;
document.getElementById('typeCooked').onclick = ()=>{ form.type='cooked'; syncType(); };
document.getElementById('typeEaten').onclick = ()=>{ form.type='eaten'; syncType(); };
document.getElementById('stars').onclick = e=>{
  const n = e.target.dataset.star;
  if(!n) return;
  form.rating = (+n === form.rating) ? 0 : +n;
  renderStars();
};
document.getElementById('photoInput').onchange = async e=>{
  const f = e.target.files[0];
  if(!f) return;
  try{ form.photo = await compress(f); renderPhoto(); }catch(err){}
  e.target.value = '';
};
document.getElementById('saveBtn').onclick = ()=>{
  const t = document.getElementById('fTitle').value.trim();
  if(!t){ document.getElementById('fTitle').focus(); return; }
  const data = {
    ...form,
    title: t,
    date: document.getElementById('fDate').value || today(),
    place: document.getElementById('fPlace').value.trim(),
    memo: document.getElementById('fMemo').value.trim(),
    url: document.getElementById('fUrl').value.trim(),
    tags: document.getElementById('fTags').value
  };
  if(form.id){
    entries = entries.map(en => en.id===form.id ? data : en);
  }else{
    entries.unshift({...data, id:uid(), createdAt:Date.now()});
  }
  entries.sort((a,b)=> new Date(b.date)-new Date(a.date) || b.createdAt-a.createdAt);
  save(); render(); closeForm();
};
document.getElementById('list').onclick = e=>{
  const del = e.target.closest('[data-del]');
  if(del){
    if(confirm('この記録を削除しますか？')){
      entries = entries.filter(en => en.id !== del.dataset.del);
      save(); render();
    }
    return;
  }
  if(e.target.closest('.cardlink')) return;
  const card = e.target.closest('.card');
  if(card){
    const en = entries.find(x => x.id === card.dataset.id);
    if(en) openForm({...en});
  }
};
document.getElementById('exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(entries,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '食卓帖-backup-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
};
document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
document.getElementById('importFile').onchange = e=>{
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!Array.isArray(data)) throw new Error();
      const merged = [...data, ...entries].filter((en,i,arr)=> arr.findIndex(o=>o.id===en.id)===i);
      merged.sort((a,b)=> new Date(b.date)-new Date(a.date) || (b.createdAt||0)-(a.createdAt||0));
      entries = merged; save(); render();
      alert('読み込みました（'+data.length+'件）');
    }catch(err){ alert('バックアップファイルを読み込めませんでした。'); }
  };
  r.readAsText(f);
  e.target.value = '';
};
document.getElementById('resetBtn').onclick = ()=>{
  if(entries.length===0) return;
  if(confirm('すべての記録を削除しますか？この操作は取り消せません。')){
    entries = []; save(); render();
  }
};

load(); render();
</script>
</body>
</html>
